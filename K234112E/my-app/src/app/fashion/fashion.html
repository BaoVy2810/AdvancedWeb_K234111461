<p>fashion works!</p>
{{ errMessage }}
<table border="1">
  <tr style="text-align: center;">
    <td>Id</td>
    <td>Fashion Subject</td>
    <td>Fashion Detail</td>
    <td>Image</td>
  </tr>
  <tbody>
    <tr *ngFor="let fashion of fashions">
      <td>{{ fashion._id }}</td>
      <td>{{ fashion.fashion_subject }}</td>
      <td>{{ fashion.fashion_detail }}</td>
      <td>
        <img src="data:image/jpeg;base64, {{ fashion.fashion_image }}" width="100px" height="100px" />
      </td>
    </tr>
  </tbody>
</table>
