<p>exercise 39 - books works!</p>
{{errMessage}}
<a routerLink="../ex43">New Book</a>
<table border="1">
    <tr>
        <th>BookId</th>
        <th>BookName</th>
        <th>Price</th>
        <th>Image</th>
    </tr>
    <tbody>
        <tr *ngFor= "let book of books">
            <td>{{book.BookId}}</td>
            <td>{{book.BookName}}</td>
            <td>{{book.Price}} </td>
            <td>
                <img src="http://localhost:3000/static/images/{{book.Image}}" width="100px" height="100px"
                    (click)="goToBookDetail(book)"
                    style="cursor:pointer;">
            </td>
            <td>
                <a style="cursor:pointer;">Edit</a>
            </td>
        </tr>
    </tbody>
</table>
