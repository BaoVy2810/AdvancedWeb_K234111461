<p>exercise 39 - books works!</p>
{{errMessage}}
<a class="New_book" routerLink="../ex43">New Book</a>
<table border="1">
    <tr>
        <th>BookId</th>
        <th>BookName</th>
        <th>Price</th>
        <th>Image</th>
        <th colspan="3">Action</th>
    </tr>
    <tbody>
        <tr *ngFor= "let book of books">
            <td>{{book.BookId}}</td>
            <td>{{book.BookName}}</td>
            <td>{{book.Price}} </td>
            <td>
                <img src="http://localhost:3000/static/images/{{book.Image}}" width="100px" height="100px"
                    (click)="goToBookDetail(book)"
                    style="cursor:pointer;">
            </td>
            <td colspan="2">
                <button class="btn-action" (click)="putBook(book)">Edit</button>
            </td>
            <td colspan="2">
                <button class="btn-action" (click)="deleteBook(book.BookId)">Delete</button>
            </td>
        </tr>
    </tbody>
</table>
