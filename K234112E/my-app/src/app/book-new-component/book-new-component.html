<p>book-new works!</p>
<p>{{ errMessage }}</p>
<table>
  <tr>
    <td>Book Id:</td>
    <td>
      <input
        type="text"
        class="form-control"
        name="BookId"
        id="BookId"
        placeholder="Enter Book Id"
        [(ngModel)]="book.BookId"
        [readonly]="isEditMode"
      />
    </td>
  </tr>
  <tr>
    <td>Book Name:</td>
    <td>
      <input
        type="text"
        class="form-control"
        name="BookName"
        id="BookName"
        placeholder="Enter Book Name"
        [(ngModel)]="book.BookName"
      />
    </td>
  </tr>
  <tr>
    <td>Price:</td>
    <td>
      <input
        type="text"
        class="form-control"
        name="BookPrice"
        id="BookPrice"
        placeholder="Enter Price"
        [(ngModel)]="book.Price"
      />
    </td>
  </tr>
  <tr>
    <td>Image:</td>
    <td>
      <input
        type="text"
        class="form-control"
        name="Image"
        id="Image"
        placeholder="Enter Image (e.g. b1.png)"
        [(ngModel)]="book.Image"
      />
    </td>
  </tr>
  <tr>
    <td colspan="2">
      <button (click)="submitBook()">{{ isEditMode ? 'Edit' : 'Submit' }}</button>
    </td>
  </tr>
</table>
<table border="1">
  <tr>
    <th>BookId</th>
    <th>BookName</th>
    <th>Price</th>
    <th>Image</th>
    <th>Edit</th>
    <th>Delete</th>
  </tr>
  <tbody>
    <tr *ngFor="let book of books">
      <td>{{ book.BookId }}</td>
      <td>{{ book.BookName }}</td>
      <td>{{ book.Price }}</td>
      <td>
        <img src="http://localhost:3000/static/images/{{book.Image}}" width="100px" height="100px"
             (click)="goToBookDetail(book)" style="cursor:pointer;" />
      </td>
      <td><button class="btn-action" (click)="editBook(book)">Edit</button></td>
      <td><button class="btn-action" (click)="deleteBook(book.BookId)">Delete</button></td>
    </tr>
  </tbody>
</table>
