<div class="book-detail-wrap">
<p>book-detail works!</p>
<p>{{errMessage}}</p>
Book Id: <input type="text" [(ngModel)]="searchId" (ngModelChange)="onSearchIdChange($event)" placeholder="Nhập Book Id">
<button (click)="searchBook(searchId)">Search</button>
<table *ngIf="book">
    <tr>
        <td>Book Id:</td>
        <td>{{book.BookId}}</td>
    </tr>
    <tr>
        <td>Book Name:</td>
        <td>{{book.BookName}}</td>
    </tr>
    <tr>
        <td>Price:</td>
        <td>{{book.Price}} </td>
    </tr>
    <tr>
        <td colspan="2">
            <img src="http://localhost:3000/static/images/{{book.Image}}">
        </td>
    </tr>
</table>
</div>
